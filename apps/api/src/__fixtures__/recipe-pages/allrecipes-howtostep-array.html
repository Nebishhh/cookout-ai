<!doctype html>
<html>
  <head>
    <title>Best Chocolate Chip Cookies (trimmed fixture)</title>
    <script type="application/ld+json">
      [
        {
          "@context": "http://schema.org",
          "@type": ["Recipe", "NewsArticle"],
          "name": "Best Chocolate Chip Cookies",
          "recipeYield": ["48", "4 dozen cookies"],
          "recipeIngredient": [
            "1 cup butter, softened",
            "1 cup white sugar",
            "1 cup packed brown sugar",
            "2 eggs",
            "2 teaspoons vanilla extract",
            "1 teaspoon baking soda",
            "2 teaspoons hot water",
            "0.5 teaspoon salt",
            "3 cups all-purpose flour",
            "2 cups semisweet chocolate chips",
            "1 cup chopped walnuts"
          ],
          "recipeInstructions": [
            {
              "@type": "HowToStep",
              "text": "Set out the ingredients with the butter soft and the eggs at room temperature."
            },
            {
              "@type": "HowToStep",
              "text": "Heat the oven to 350 degrees F and cream the butter with both sugars until fluffy."
            },
            { "@type": "HowToStep", "text": "Mix in the eggs one by one, then the vanilla." },
            {
              "@type": "HowToStep",
              "text": "Stir the baking soda into the hot water and add it to the dough with the salt."
            },
            {
              "@type": "HowToStep",
              "text": "Mix in the flour until no dry patches are left, then fold in the chips and walnuts."
            },
            {
              "@type": "HowToStep",
              "text": "Scoop the dough onto ungreased sheets, leaving room between each cookie."
            },
            {
              "@type": "HowToStep",
              "text": "Bake about 10 minutes, until the edges brown and the middles just set."
            },
            {
              "@type": "HowToStep",
              "text": "Rest the cookies on the sheets for a moment, then move them to a rack."
            },
            {
              "@type": "HowToStep",
              "text": "Serve, or keep the cooled cookies in a sealed container."
            }
          ]
        }
      ]
    </script>
  </head>
  <body></body>
</html>
