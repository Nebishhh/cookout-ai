<!doctype html>
<html>
  <head>
    <title>Easy pancakes (trimmed fixture)</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Easy pancakes",
        "recipeYield": "Makes 12",
        "recipeIngredient": [
          "100g plain flour",
          "2 large eggs",
          "300ml milk",
          "1 tbsp sunflower or vegetable oil plus a little extra for frying",
          "lemon wedges to serve (optional)",
          "caster sugar to serve (optional)"
        ],
        "recipeInstructions": [
          {
            "@type": "HowToStep",
            "text": "Whisk the flour, eggs, milk, oil and a pinch of salt into a smooth batter."
          },
          { "@type": "HowToStep", "text": "Let it rest for 30 minutes if there is time." },
          {
            "@type": "HowToStep",
            "text": "Heat a frying pan over medium heat and wipe it with oiled paper."
          },
          {
            "@type": "HowToStep",
            "text": "Cook each pancake for about a minute a side until golden."
          },
          {
            "@type": "HowToStep",
            "text": "Serve with lemon and sugar, or stack between parchment to freeze."
          }
        ]
      }
    </script>
  </head>
  <body></body>
</html>
