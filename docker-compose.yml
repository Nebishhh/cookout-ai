services:
  app:
    build: .
    image: cookout-ai:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: file:/data/prod.db
    volumes:
      - cookout_data:/data
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  cookout_data:
  caddy_data:
  caddy_config:
